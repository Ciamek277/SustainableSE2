[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "greenlint"
version = "0.1.0"
description = "CLI tool that flags common Python patterns that tend to use more CPU (proxy for energy waste)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
greenlint = "greenlint.cli:main"

# Hatchling maps the distribution name "greenlint" to the import package `greenlint/` by default.

[tool.pytest.ini_options]
testpaths = ["tests"]
