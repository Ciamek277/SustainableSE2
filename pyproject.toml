[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "greenlint"
version = "0.2.0"
description = "GreenLint — AST-based detection of energy-wasteful Python patterns with benchmark-backed estimates"
readme = "README.md"
requires-python = ">=3.10"
# Core CLI: stdlib + loads per-rule estimates from packaged or local JSON.
# Pandas / CodeCarbon are only needed to run the benchmark pipeline under experiments/.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
benchmarks = [
    "pandas>=2.0",
    "codecarbon>=2.3",
]

[project.scripts]
greenlint = "greenlint.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
